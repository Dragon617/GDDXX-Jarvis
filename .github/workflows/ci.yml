name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Linux audio library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q jarvis app tests
      - name: brain and onboarding (fake model server)
        run: python tests/test_brain.py
      - name: every module imports
        run: python -c "import jarvis.service, jarvis.gesture, jarvis.onboard, jarvis.tools as t; print(sorted(t.names()))"

  voice:
    # the 23 voice scenarios (synthetic speech in tests/clips_en) need the speech models: cached between runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('app/models.json') }}
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -r requirements.txt
      - run: python app/install.py --no-page --models-only
        env: {JARVIS_APP_DIR: "${{ github.workspace }}"}
      - run: python tests/simulate_en.py
        env: {JARVIS_VOICE_MODELS: "${{ github.workspace }}/models"}

  hud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: (cd hud && python3 -m http.server 8811 &) && sleep 2 && node tests/hud_check.js http://127.0.0.1:8811/index.html

  build:
    # installers: built on every PR (to keep the scripts working) and on v* tags (published by the release job)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    needs: [test, hud]
    strategy:
      matrix:
        include:
          - {os: macos-14, script: "bash platform/mac/build.sh arm64", out: "dist/*.dmg"}
          - {os: macos-15-intel, script: "bash platform/mac/build.sh x86_64", out: "dist/*.dmg"}
          - {os: windows-latest, script: "choco install innosetup -y --no-progress; powershell -ExecutionPolicy Bypass -File platform/win/build.ps1", out: "dist/*.exe"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: ${{ matrix.script }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with: {name: "jarvis-${{ matrix.os }}", path: "${{ matrix.out }}"}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - name: publish the installers on the Releases page
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.exe --title "Jarvis ${GITHUB_REF_NAME#v}" --notes-file docs/release-notes.md --latest
